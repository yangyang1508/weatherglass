name: Release

# Push a tag such as v1.0.0 to build the app and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build the app (universal, ad-hoc signed)
        run: scripts/build-app.sh
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          1. Download **Weatherglass.zip**, unzip it, and move **Weatherglass.app** to Applications.
          2. Weatherglass is not signed by Apple, so macOS blocks it the first time. Open it once, then go to
             **System Settings → Privacy & Security** and click **Open Anyway**.
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Weatherglass.zip --title "Weatherglass ${GITHUB_REF_NAME#v}" --notes-file notes.md
