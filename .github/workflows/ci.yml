name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show the Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the app (universal, ad-hoc signed)
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Weatherglass
          path: dist/Weatherglass.zip
